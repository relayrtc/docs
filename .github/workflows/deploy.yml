name: Deploy documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Deploy to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set VPS_HOST in repository secrets}"
          : "${VPS_SSH_KEY:?Set VPS_SSH_KEY in repository secrets}"
          : "${VPS_KNOWN_HOSTS:?Set VPS_KNOWN_HOSTS in repository secrets}"
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -T -i "$ssh_dir/key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "root@$VPS_HOST" /usr/local/bin/relayrtc-docs-deploy
